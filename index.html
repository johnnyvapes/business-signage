<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store 4 Screen 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;font-family:Arial,Helvetica,sans-serif}#stage{position:fixed;inset:0;background:#080d13}#stage>img,#stage>video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;border:0}
.weather{position:fixed;inset:0;box-sizing:border-box;padding:3vw 3.2vw;color:#fff;background:linear-gradient(135deg,#173b5c,#286f99)}.head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:clamp(32px,4vw,68px);font-weight:700}.date{font-size:clamp(17px,1.7vw,30px);color:#fff;opacity:.85;margin-top:.3vw}.live{font-size:clamp(15px,1.5vw,25px);letter-spacing:.08em;opacity:.8}.current{display:flex;align-items:center;height:23vh;gap:1.4vw}.icon{font-size:clamp(55px,7vw,120px)}.temp{font-size:clamp(65px,8vw,130px);font-weight:700;line-height:.9}.condition{font-size:clamp(22px,2.5vw,42px);margin-top:10px}.details{font-size:clamp(17px,1.7vw,29px);opacity:.9}.hourly-title,.daily-title{font-size:clamp(18px,1.8vw,30px);font-weight:700}.hourly-title{margin-bottom:.7vw}.daily-title{margin:1.2vw 0 .55vw}.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.45vw}.hour{background:rgba(0,0,0,.18);border-radius:10px;text-align:center;padding:.65vw .15vw}.hour .t{font-size:clamp(13px,1.25vw,22px);font-weight:700}.hour .i{font-size:clamp(22px,2.4vw,42px);margin:.35vw 0}.hour .deg{font-size:clamp(16px,1.65vw,28px);font-weight:700}.hour .rain{font-size:clamp(14px,1.45vw,24px);margin-top:.3vw}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.55vw}.day{background:rgba(0,0,0,.18);border-radius:10px;padding:.55vw;text-align:center}.dayname{font-size:clamp(14px,1.45vw,24px);font-weight:700}.dayicon{font-size:clamp(24px,2.5vw,42px)}.high{font-size:clamp(18px,1.7vw,29px);font-weight:700}.low{font-size:clamp(14px,1.4vw,23px);opacity:.7}.precip{font-size:clamp(13px,1.3vw,21px);margin-top:.2vw}.updated{position:absolute;bottom:.7vw;right:1.2vw;font-size:12px;opacity:.45}
.fbpost{position:fixed;inset:0;box-sizing:border-box;padding:5vw 6vw;background:#f5f6f8;color:#202124;display:flex;flex-direction:column;justify-content:center}.fbpost .fb-label{font-size:2vw;font-weight:700;letter-spacing:.08em;color:#1877f2;margin-bottom:2vw}.fbpost .fb-card{background:#fff;border-radius:22px;padding:4vw 5vw;box-shadow:0 4px 18px rgba(0,0,0,.10)}.fbpost .fb-date{font-size:1.35vw;color:#777;margin-bottom:1.4vw}.fbpost .fb-text{font-size:3vw;line-height:1.4;white-space:pre-wrap;overflow-wrap:break-word}.fbpost .fb-footer{position:absolute;bottom:1.4vw;left:6vw;right:6vw;display:flex;justify-content:space-between;font-size:1.1vw;color:#888}.fbpost .fb-mark{font-weight:700;color:#1877f2}
.reviews{position:fixed;inset:0;padding:4vw 5vw;background:#f5f6f8;color:#202124}.reviews .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5vw}.brand{font-size:3.8vw;font-weight:700}.location{font-size:1.6vw;color:#6b7078;margin-top:.3vw}.google{font-size:1.8vw;font-weight:700;color:#5f6368}.heading{text-align:center;font-size:2.8vw;font-weight:700;margin:1vw 0 1.8vw}.review{background:#fff;border-radius:22px;padding:3vw 4vw;box-shadow:0 4px 18px rgba(0,0,0,.10);width:100%;min-height:50vh;display:flex;flex-direction:column;justify-content:center}.review-stars{font-size:3.5vw;letter-spacing:.08em;margin-bottom:1.2vw;color:#fbbc04}.author{font-size:2.2vw;font-weight:700}.review-date{font-size:1.25vw;color:#777;margin-top:.35vw}.review-text{font-size:2.8vw;line-height:1.4;margin-top:2vw;overflow-wrap:break-word;word-wrap:break-word}.footer{position:absolute;bottom:1.2vw;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:1.1vw;color:#888}.message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font-size:4vw}
</style></head><body><div id="stage"></div>
<script>
const CONFIG="config.json";
const REVIEWS="johnny_vapes_bellevue_4_5_star.json";
let playlist=[],currentSlide=-1,timer=null,reviewTimer=null,video=null;
const WMO={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫️","Foggy"],48:["🌫️","Foggy"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Showers"],81:["🌧️","Heavy showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
function clean(){clearTimeout(timer);clearTimeout(reviewTimer);timer=null;reviewTimer=null;if(video){try{video.pause();video.removeAttribute("src");video.load();video.remove()}catch(e){}video=null}document.getElementById("stage").replaceChildren()}
async function init(){const r=await fetch(CONFIG+"?v="+Date.now(),{cache:"no-store"});const c=await r.json();playlist=(c.playlist||[]).filter(x=>x.enabled!==false);if(!playlist.length)throw Error("Empty playlist");next()}
function next(){clean();currentSlide=(currentSlide+1)%playlist.length;const x=playlist[currentSlide],s=document.getElementById("stage");if(x.type==="image"){const e=document.createElement("img");e.src=x.src;s.appendChild(e);timer=setTimeout(next,(x.seconds||10)*1000);return}if(x.type==="video"){video=document.createElement("video");video.autoplay=true;video.muted=true;video.defaultMuted=true;video.playsInline=true;video.preload="auto";video.controls=false;video.setAttribute("autoplay","");video.setAttribute("muted","");video.setAttribute("playsinline","");video.setAttribute("disablepictureinpicture","");video.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");video.src=x.src;video.addEventListener("ended",next,{once:true});video.addEventListener("error",()=>setTimeout(next,3000),{once:true});s.appendChild(video);video.load();video.play().catch(()=>{});return}if(x.type==="weather"){weather(x.seconds||20);return}if(x.type==="google_reviews"){googleReviews(x.seconds||12);return}s.innerHTML='<div class="message">Unsupported slide type</div>';timer=setTimeout(next,5000)}
async function weather(seconds){const s=document.getElementById("stage"),b=document.createElement("div");b.className="weather";b.innerHTML='<div style="font-size:3vw">Loading Bellevue weather…</div>';s.appendChild(b);try{const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?name=Bellevue&count=5&language=en&format=json&countryCode=US")).json();const place=(g.results||[]).find(x=>x.admin1==="Wisconsin")||g.results[0];if(!place)throw 0;const u="https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=5";const d=await(await fetch(u)).json(),c=d.current,hd=d.hourly,dy=d.daily,cc=WMO[c.weather_code]||["🌤️","Conditions"];let start=hd.time.findIndex(q=>q>=c.time);if(start<0)start=0;let hours="";for(let n=0;n<12;n++){let k=start+n;if(k>=hd.time.length)break;let tm=new Intl.DateTimeFormat("en-US",{hour:"numeric"}).format(new Date(hd.time[k])),z=WMO[hd.weather_code[k]]||["🌤️",""];let rain=Math.round(hd.precipitation_probability[k]??0);hours+=`<div class="hour"><div class="t">${tm}</div><div class="i">${z[0]}</div><div class="deg">${Math.round(hd.temperature_2m[k])}°</div><div class="rain">💧 <b>${rain}%</b></div></div>`}let days="";for(let n=0;n<5;n++){let z=WMO[dy.weather_code[n]]||["🌤️",""];let name=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(new Date(dy.time[n]+"T12:00:00"));days+=`<div class="day"><div class="dayname">${name}</div><div class="dayicon">${z[0]}</div><span class="high">${Math.round(dy.temperature_2m_max[n])}°</span> / <span class="low">${Math.round(dy.temperature_2m_min[n])}°</span><div class="precip">💧 ${Math.round(dy.precipitation_probability_max[n]??0)}%</div></div>`}const date=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric"}).format(new Date(c.time));b.innerHTML=`<div class="head"><div><div class="title">Bellevue, WI</div><div class="date">${date}</div></div><div class="live">LIVE WEATHER</div></div><div class="current"><div class="icon">${cc[0]}</div><div><div class="temp">${Math.round(c.temperature_2m)}°</div><div class="condition">${cc[1]}</div><div class="details">Feels like ${Math.round(c.apparent_temperature)}° • Humidity ${Math.round(c.relative_humidity_2m)}% • Wind ${Math.round(c.wind_speed_10m)} mph</div></div></div><div class="hourly-title">NEXT 12 HOURS • PRECIPITATION CHANCE</div><div class="hours">${hours}</div><div class="daily-title">5-DAY FORECAST</div><div class="days">${days}</div><div class="updated">Updated ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div>`}catch(e){b.innerHTML='<div style="font-size:4vw">Bellevue Weather<br><small>Weather data temporarily unavailable</small></div>'}timer=setTimeout(next,seconds*1000)}
function getReviewText(r){if(!r.description)return"";if(typeof r.description==="string")return r.description.trim();if(r.description.en&&typeof r.description.en==="string")return r.description.en.trim();return""}
function formatDate(s){if(!s)return"";const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}
async function facebookPost(seconds){const s=document.getElementById("stage"),b=document.createElement("div");b.className="fbpost";b.innerHTML='<div class="fb-label">LATEST FROM FACEBOOK</div><div class="fb-card"><div class="fb-date" id="fb-date"></div><div class="fb-text" id="fb-text">Loading Facebook post…</div></div><div class="fb-footer"><div>Johnny Vapes</div><div class="fb-mark">Facebook</div></div>';s.appendChild(b);try{const data=await(await fetch("facebook-posts.json?v="+Date.now(),{cache:"no-store"})).json();const posts=Array.isArray(data)?data:(data.data||[]),p=posts[0];if(!p){document.getElementById("fb-text").textContent="No Facebook posts available."}else{document.getElementById("fb-date").textContent=formatDate(p.created_time);document.getElementById("fb-text").textContent=p.message||p.story||"Facebook post"}}catch(e){document.getElementById("fb-text").textContent="Unable to load Facebook post."}timer=setTimeout(next,seconds*1000)}
async function facebookReview(seconds){const s=document.getElementById("stage"),b=document.createElement("div");b.className="reviews";b.innerHTML='<div class="header"><div><div class="brand">Johnny Vapes</div><div class="location">Bellevue, WI</div></div><div class="google">Facebook Reviews</div></div><div class="heading">What Our Customers Are Saying</div><div class="review"><div class="review-stars">★★★★★</div><div class="author">Facebook Customer</div><div class="review-date" id="fb-review-date"></div><div class="review-text" id="fb-review-text">Loading Facebook review…</div></div><div class="footer"><div>Customer reviews • Johnny Vapes Bellevue</div><div>Facebook</div></div>';s.appendChild(b);try{const data=await(await fetch("facebook-reviews.json?v="+Date.now(),{cache:"no-store"})).json();const reviews=Array.isArray(data)?data:(data.data||[]),r=reviews[0];if(!r){document.getElementById("fb-review-text").textContent="No Facebook reviews available."}else{document.getElementById("fb-review-date").textContent=formatDate(r.created_time);document.getElementById("fb-review-text").textContent=r.review_text||""}}catch(e){document.getElementById("fb-review-text").textContent="Unable to load Facebook review."}timer=setTimeout(next,seconds*1000)}
async function init(){playlist=[{type:"facebook_post",seconds:10},{type:"facebook_review",seconds:10}];next()}
function next(){clean();currentSlide=(currentSlide+1)%playlist.length;const x=playlist[currentSlide];if(x.type==="facebook_post"){facebookPost(x.seconds||10);return}if(x.type==="facebook_review"){facebookReview(x.seconds||10);return}timer=setTimeout(next,5000)}

init().catch(()=>document.getElementById("stage").innerHTML='<div class="message">Unable to load signage configuration.</div>');
</script></body></html>
