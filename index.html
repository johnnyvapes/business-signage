<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes Bellevue Traffic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#stage{width:100vw;height:100vh;position:relative}
.traffic{position:absolute;inset:0;background:linear-gradient(135deg,#eef3f8,#dce6f0);display:flex;flex-direction:column;padding:2.2vw 3vw 1.2vw;color:#111827}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:2vw;padding-bottom:1vw}
.title{font-size:3.3vw;font-weight:800;letter-spacing:.02em}
.subtitle{font-size:1.35vw;color:#4b5563;margin-top:.25vw}
.source{font-size:1.35vw;font-weight:700;color:#185abc;text-align:right}
.map-wrap{position:relative;flex:1;min-height:0;background:#fff;border-radius:1.2vw;overflow:hidden;box-shadow:0 .5vw 1.8vw rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.9)}
.map{width:100%;height:100%;object-fit:contain;background:#eef2f7}
.bottom{display:flex;align-items:center;justify-content:space-between;padding-top:.8vw;font-size:1vw;color:#4b5563}
.legend{display:flex;gap:1.2vw;align-items:center}
.item{display:flex;align-items:center;gap:.35vw;font-weight:700}
.dot{width:.8vw;height:.8vw;border-radius:50%;display:inline-block}
.updated{font-weight:600}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2vw;color:#4b5563;background:#eef2f7}
.error{color:#991b1b;background:#fee2e2}
</style>
</head>
<body>
<div id="stage">
  <div class="traffic">
    <div class="top">
      <div>
        <div class="title">CURRENT TRAFFIC NEAR JOHNNY VAPES</div>
        <div class="subtitle">Bellevue • 1681 Lime Kiln Rd, Green Bay, WI 54311</div>
      </div>
      <div class="source">LIVE TRAFFIC<br>511WI</div>
    </div>
    <div class="map-wrap">
      <div id="loading" class="loading">Loading current traffic…</div>
      <img id="map" class="map" alt="Current traffic near Johnny Vapes Bellevue">
    </div>
    <div class="bottom">
      <div class="legend">
        <span class="item"><span class="dot" style="background:#22c55e"></span>Normal</span>
        <span class="item"><span class="dot" style="background:#facc15"></span>Moderate</span>
        <span class="item"><span class="dot" style="background:#f97316"></span>Slow</span>
        <span class="item"><span class="dot" style="background:#ef4444"></span>Very Slow</span>
        <span class="item"><span class="dot" style="background:#b91c1c"></span>Incident</span>
      </div>
      <div id="updated" class="updated">Traffic data generated by 511WI</div>
    </div>
  </div>
</div>
<script>
const MAP="traffic/bellevue/traffic.png";
const DATA="traffic/bellevue/traffic.json";
const bust=u=>u+(u.includes("?")?"&":"?")+"t="+Date.now();

async function loadTraffic(){
  const img=document.getElementById("map");
  const loading=document.getElementById("loading");
  try{
    const response=await fetch(bust(DATA),{cache:"no-store"});
    if(response.ok){
      const data=await response.json();
      if(data.updated_local){
        document.getElementById("updated").textContent="Updated "+data.updated_local+" • 511WI";
      }
    }
  }catch(e){}
  img.onload=()=>loading.style.display="none";
  img.onerror=()=>{
    loading.textContent="Unable to load the Bellevue traffic map.";
    loading.classList.add("error");
  };
  img.src=bust(MAP);
}
loadTraffic();
setInterval(loadTraffic,5*60*1000);
</script>
</body>
</html>
