<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R2 Dynamic Video Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000}
#status{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;
font:16px Arial;opacity:.55;text-shadow:0 2px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">Starting video…</div>
<script>
const stage=document.getElementById("stage");
const status=document.getElementById("status");

setTimeout(()=>{
  const v=document.createElement("video");
  v.setAttribute("autoplay","");
  v.setAttribute("muted","");
  v.setAttribute("playsinline","");
  v.setAttribute("preload","auto");
  v.muted=true;
  v.playsInline=true;
  v.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;";
  stage.appendChild(v);

  v.addEventListener("playing",()=>status.textContent="Playing automatically");
  v.addEventListener("ended",()=>status.textContent="VIDEO FINISHED");
  v.addEventListener("error",()=>status.textContent="Video failed to load");

  v.src="https://pub-3250bab389bf4d21b5ff0b1f63045fc7.r2.dev/vid1.mp4";
  v.load();
  v.play().catch(()=>status.textContent="Loaded, but autoplay was blocked");
},1500);
</script>
</body>
</html>
