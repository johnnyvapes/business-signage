<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store 4 Screen 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13}
#stage{position:fixed;inset:0;background:#080d13}
#stage img,#stage video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;border:0}
.weather{position:fixed;inset:0;box-sizing:border-box;padding:3.0vw 3.2vw;color:#fff;font-family:Arial,sans-serif;background:linear-gradient(135deg,#173b5c,#286f99)}
.head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:clamp(32px,4vw,68px);font-weight:700}.date{font-size:clamp(17px,1.7vw,30px);opacity:.85;margin-top:.3vw}.live{font-size:clamp(15px,1.5vw,25px);letter-spacing:.08em;opacity:.8}
.current{display:flex;align-items:center;height:23vh;gap:1.4vw}.icon{font-size:clamp(55px,7vw,120px)}.temp{font-size:clamp(65px,8vw,130px);font-weight:700;line-height:.9}.condition{font-size:clamp(22px,2.5vw,42px);margin-top:10px}.details{font-size:clamp(17px,1.7vw,29px);opacity:.9}
.hourly-title{font-size:clamp(18px,1.8vw,30px);font-weight:700;margin-bottom:.7vw}.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.45vw}
.hour{background:rgba(0,0,0,.18);border-radius:10px;text-align:center;padding:.65vw .15vw}.hour .t{font-size:clamp(13px,1.25vw,22px);font-weight:700}.hour .i{font-size:clamp(22px,2.4vw,42px);margin:.35vw 0}.hour .deg{font-size:clamp(16px,1.65vw,28px);font-weight:700}.hour .rain{font-size:clamp(14px,1.45vw,24px);margin-top:.3vw}.hour .rain b{font-weight:700}
.daily-title{font-size:clamp(18px,1.8vw,30px);font-weight:700;margin:1.2vw 0 .55vw}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.55vw}.day{background:rgba(0,0,0,.18);border-radius:10px;padding:.55vw;text-align:center}.dayname{font-size:clamp(14px,1.45vw,24px);font-weight:700}.dayicon{font-size:clamp(24px,2.5vw,42px)}.high{font-size:clamp(18px,1.7vw,29px);font-weight:700}.low{font-size:clamp(14px,1.4vw,23px);opacity:.7}.precip{font-size:clamp(13px,1.3vw,21px);margin-top:.2vw}
.updated{position:absolute;bottom:.7vw;right:1.2vw;font-size:12px;opacity:.45}
.livebox{position:fixed;inset:0;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Arial;text-align:center}.livebox h1{font-size:6vw;margin:0 0 1vw}.livebox p{font-size:3vw;margin:0}
</style></head><body><div id="stage"></div>
<script>
const CONFIG="config.json";let p=[],i=-1,timer=null,video=null;
const WMO={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫️","Foggy"],48:["🌫️","Foggy"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Showers"],81:["🌧️","Heavy showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function init(){let r=await fetch(CONFIG+"?v="+Date.now(),{cache:"no-store"}),c=await r.json();p=(c.playlist||[]).filter(x=>x.enabled!==false);next()}
function clean(){clearTimeout(timer);if(video){try{video.pause();video.removeAttribute("src");video.load();video.remove()}catch(e){}video=null}document.getElementById("stage").replaceChildren()}
function next(){clean();i=(i+1)%p.length;let x=p[i],s=document.getElementById("stage");
 if(x.type==="image"){let e=document.createElement("img");e.src=x.src;s.appendChild(e);timer=setTimeout(next,(x.seconds||10)*1000);return}
 if(x.type==="video"){video=document.createElement("video");Object.assign(video,{autoplay:true,muted:true,defaultMuted:true,playsInline:true,preload:"auto",controls:false});video.setAttribute("autoplay","");video.setAttribute("muted","");video.setAttribute("playsinline","");video.setAttribute("disablepictureinpicture","");video.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");video.src=x.src;video.addEventListener("ended",next,{once:true});video.addEventListener("error",()=>setTimeout(next,3000),{once:true});s.appendChild(video);video.load();video.play().catch(()=>{});return}
 if(x.type==="weather"){weather(x.seconds||20);return}
 let b=document.createElement("div");b.className="livebox";b.innerHTML="<h1>"+esc(x.title||"Live Feed")+"</h1><p>Live feed will be connected here.</p>";s.appendChild(b);timer=setTimeout(next,(x.seconds||12)*1000)
}
async function weather(seconds){
 let s=document.getElementById("stage"),b=document.createElement("div");b.className="weather";b.innerHTML='<div style="font-size:3vw">Loading Bellevue weather…</div>';s.appendChild(b);
 try{
  let g=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?name=Bellevue&count=5&language=en&format=json&countryCode=US")).json();
  let place=(g.results||[]).find(x=>x.admin1==="Wisconsin")||g.results[0];if(!place)throw 0;
  let u="https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+
   "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"+
   "&hourly=temperature_2m,weather_code,precipitation_probability"+
   "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
   "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=5";
  let d=await (await fetch(u)).json(),c=d.current,hd=d.hourly,dy=d.daily,cc=WMO[c.weather_code]||["🌤️","Conditions"];
  let start=hd.time.findIndex(q=>q>=c.time);if(start<0)start=0;
  let hours="";for(let n=0;n<12;n++){let k=start+n;if(k>=hd.time.length)break;let dt=new Date(hd.time[k]);let tm=new Intl.DateTimeFormat("en-US",{hour:"numeric"}).format(dt),z=WMO[hd.weather_code[k]]||["🌤️",""],rain=Math.round(hd.precipitation_probability[k]??0);hours+=`<div class="hour"><div class="t">${tm}</div><div class="i">${z[0]}</div><div class="deg">${Math.round(hd.temperature_2m[k])}°</div><div class="rain">💧 <b>${rain}%</b></div></div>`}
  let days="";for(let n=0;n<5;n++){let z=WMO[dy.weather_code[n]]||["🌤️",""],name=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(new Date(dy.time[n]+"T12:00:00"));days+=`<div class="day"><div class="dayname">${name}</div><div class="dayicon">${z[0]}</div><span class="high">${Math.round(dy.temperature_2m_max[n])}°</span> / <span class="low">${Math.round(dy.temperature_2m_min[n])}°</span><div class="precip">💧 ${Math.round(dy.precipitation_probability_max[n]??0)}%</div></div>`}
  let dt=new Date(c.time),date=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric"}).format(dt);
  b.innerHTML=`<div class="head"><div><div class="title">Bellevue, WI</div><div class="date">${date}</div></div><div class="live">LIVE WEATHER</div></div>
  <div class="current"><div class="icon">${cc[0]}</div><div><div class="temp">${Math.round(c.temperature_2m)}°</div><div class="condition">${cc[1]}</div><div class="details">Feels like ${Math.round(c.apparent_temperature)}° • Humidity ${Math.round(c.relative_humidity_2m)}% • Wind ${Math.round(c.wind_speed_10m)} mph</div></div></div>
  <div class="hourly-title">NEXT 12 HOURS • PRECIPITATION CHANCE</div><div class="hours">${hours}</div>
  <div class="daily-title">5-DAY FORECAST</div><div class="days">${days}</div><div class="updated">Updated ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div>`;
 }catch(e){b.innerHTML='<div style="font-size:4vw">Bellevue Weather<br><small>Weather data temporarily unavailable</small></div>'}
 timer=setTimeout(next,seconds*1000)
}
init().catch(()=>document.getElementById("stage").innerHTML='<div class="livebox"><h1>Signage Error</h1><p>Unable to load playlist.</p></div>');
</script></body></html>
