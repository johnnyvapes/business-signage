<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes — Store 4 / Screen 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
opacity:0;visibility:hidden;background:#000;transition:opacity .5s ease}
.slide.active{opacity:1;visibility:visible}
.slide img{width:100%;height:100%;object-fit:contain}
.slide video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
.live{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
justify-content:center;text-align:center;color:#fff;font-family:Arial,sans-serif}
.live h1{font-size:clamp(42px,6vw,92px);margin:0 0 20px}
.live p{font-size:clamp(24px,3vw,48px);margin:0}
#debug{position:fixed;z-index:100;left:12px;bottom:10px;color:#fff;font:12px Arial;
opacity:.25;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="debug">Store 4 • Screen 1</div>

<script>
const CONFIG_URL="config.json";
let cfg, items=[], index=0, timer=null, activeVideo=null;

async function load(){
  const response=await fetch(CONFIG_URL+"?v="+Date.now(),{cache:"no-store"});
  if(!response.ok) throw new Error("config");
  cfg=await response.json();
  items=(cfg.playlist||[]).filter(x=>x.enabled!==false);
  if(!items.length) throw new Error("empty playlist");
  render();
  show(0);
}

function render(){
  const stage=document.getElementById("stage");
  stage.innerHTML="";
  items.forEach((item,n)=>{
    const slide=document.createElement("section");
    slide.className="slide";
    slide.dataset.index=n;
    if(item.type==="image"){
      const img=document.createElement("img");
      img.src=item.src;
      img.alt="";
      img.draggable=false;
      slide.appendChild(img);
    }else if(item.type==="live"){
      const box=document.createElement("div");
      box.className="live";
      box.innerHTML="<h1>"+escapeHtml(item.title||"Live Feed")+
                   "</h1><p>Live data will be connected here.</p>";
      slide.appendChild(box);
    }
    stage.appendChild(slide);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"}[c]));
}

function show(n){
  clearTimeout(timer);
  if(activeVideo){try{activeVideo.pause()}catch(e){} activeVideo.remove(); activeVideo=null;}
  document.querySelectorAll(".slide").forEach(x=>x.classList.remove("active"));
  index=(n+items.length)%items.length;
  const item=items[index];
  const slide=document.querySelector('.slide[data-index="'+index+'"]');
  if(!slide) return;
  slide.classList.add("active");

  if(item.type==="video"){
    // Create the video dynamically. This is intentional: it prevents BrowseHere
    // from taking over the video with its own detected-video UI.
    const v=document.createElement("video");
    v.autoplay=true;
    v.muted=true;
    v.defaultMuted=true;
    v.playsInline=true;
    v.preload="auto";
    v.controls=false;
    v.setAttribute("autoplay","");
    v.setAttribute("muted","");
    v.setAttribute("playsinline","");
    v.setAttribute("disablepictureinpicture","");
    v.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");
    v.src=item.src;
    slide.appendChild(v);
    activeVideo=v;

    const next=()=>show(index+1);
    v.addEventListener("ended",next,{once:true});
    v.addEventListener("error",()=>setTimeout(next,3000),{once:true});
    v.load();
    v.play().catch(()=>{});
  }else{
    const seconds=Number(item.seconds || cfg.defaults?.liveSeconds || 12);
    timer=setTimeout(()=>show(index+1),Math.max(1,seconds)*1000);
  }
}

load().catch(err=>{
  document.getElementById("stage").innerHTML=
    '<div class="live"><h1>Signage Error</h1><p>Could not load the playlist.</p></div>';
});
</script>
</body>
</html>
