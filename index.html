<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R2 Canvas Video Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{position:fixed;inset:0;width:100vw;height:100vh;background:#000}
#status{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;
font:16px Arial;opacity:.55;text-shadow:0 2px 4px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="status">Loading canvas video…</div>
<script>
const URL="https://pub-3250bab389bf4d21b5ff0b1f63045fc7.r2.dev/vid1.mp4";
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

const v=document.createElement("video");
v.muted=true;
v.defaultMuted=true;
v.playsInline=true;
v.autoplay=true;
v.preload="auto";
v.src=URL;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
}
resize();
addEventListener("resize",resize);

v.addEventListener("playing",()=>status.textContent="Playing automatically");
v.addEventListener("ended",()=>status.textContent="VIDEO FINISHED");
v.addEventListener("error",()=>status.textContent="Video failed to load");

function draw(){
  if(v.readyState>=2){
    const vw=v.videoWidth, vh=v.videoHeight;
    if(vw&&vh){
      const scale=Math.min(canvas.width/vw,canvas.height/vh);
      const w=vw*scale, h=vh*scale;
      const x=(canvas.width-w)/2, y=(canvas.height-h)/2;
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(v,x,y,w,h);
    }
  }
  requestAnimationFrame(draw);
}
draw();

v.load();
v.play().catch(()=>status.textContent="Loaded, but autoplay was blocked");
</script>
</body>
</html>
