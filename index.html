<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes Bellevue Signage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;width:100vw;height:100vh;background:#080d13}
#stage>img,#stage>video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#080d13;border:0}
.weather{position:fixed;inset:0;box-sizing:border-box;padding:3vw 3.2vw;color:#fff;background:linear-gradient(135deg,#173b5c,#286f99)}
.head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:clamp(32px,4vw,68px);font-weight:700}.date{font-size:clamp(17px,1.7vw,30px);opacity:.85;margin-top:.3vw}.live{font-size:clamp(15px,1.5vw,25px);letter-spacing:.08em;opacity:.8}
.current{display:flex;align-items:center;height:23vh;gap:1.4vw}.icon{font-size:clamp(55px,7vw,120px)}.temp{font-size:clamp(65px,8vw,130px);font-weight:700;line-height:.9}.condition{font-size:clamp(22px,2.5vw,42px);margin-top:10px}.details{font-size:clamp(17px,1.7vw,29px);opacity:.9}
.hourly-title,.daily-title{font-size:clamp(18px,1.8vw,30px);font-weight:700}.hourly-title{margin-bottom:.7vw}.daily-title{margin:1.2vw 0 .55vw}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.45vw}.hour{background:rgba(0,0,0,.18);border-radius:10px;text-align:center;padding:.65vw .15vw}.hour .t{font-size:clamp(13px,1.25vw,22px);font-weight:700}.hour .i{font-size:clamp(22px,2.4vw,42px);margin:.35vw 0}.hour .deg{font-size:clamp(16px,1.65vw,28px);font-weight:700}.hour .rain{font-size:clamp(14px,1.45vw,24px);margin-top:.3vw}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.55vw}.day{background:rgba(0,0,0,.18);border-radius:10px;padding:.55vw;text-align:center}.dayname{font-size:clamp(14px,1.45vw,24px);font-weight:700}.dayicon{font-size:clamp(24px,2.5vw,42px)}.high{font-size:clamp(18px,1.7vw,29px);font-weight:700}.low{font-size:clamp(14px,1.4vw,23px);opacity:.7}.precip{font-size:clamp(13px,1.3vw,21px);margin-top:.2vw}.updated{position:absolute;bottom:.7vw;right:1.2vw;font-size:12px;opacity:.45}
.cardpage{position:fixed;inset:0;box-sizing:border-box;padding:4vw 5vw;color:#202124;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5vw}.brand{font-size:3.8vw;font-weight:700}.location{font-size:1.6vw;margin-top:.3vw}.source{font-size:1.8vw;font-weight:700}
.heading{text-align:center;font-size:2.8vw;font-weight:700;margin:1vw 0 1.8vw}.card{border-radius:22px;padding:2.4vw 3.2vw;width:100%;height:58vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stars{font-size:3.5vw;letter-spacing:.08em;margin-bottom:1.2vw}.author{font-size:2.2vw;font-weight:700}.review-date{font-size:1.25vw;margin-top:.35vw}.review-text{font-size:2.8vw;line-height:1.3;margin-top:1.5vw;overflow-wrap:break-word;word-wrap:break-word;max-height:36vh;overflow:hidden}
.footer{position:absolute;bottom:1.2vw;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:1.1vw}
.cardpage.google-theme{background:linear-gradient(135deg,#f8fbff 0%,#fff 52%,#eef4ff 100%)}.google-theme:before{content:"";position:absolute;left:0;right:0;top:0;height:1.1vw;background:linear-gradient(90deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75% 100%)}.google-theme .location{color:#5f6368}.google-theme .source{color:#4285f4}.google-theme .card{background:rgba(255,255,255,.96);border:2px solid #dfe5ef;box-shadow:0 10px 30px rgba(66,133,244,.14)}.google-theme .stars{background:linear-gradient(90deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.google-theme .review-date,.google-theme .footer{color:#6b7078}.google-theme .footer div:last-child{color:#4285f4;font-weight:700}
.fbpost{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4vw 6vw;background:linear-gradient(135deg,#071b38 0%,#0b3d78 52%,#1877f2 100%);color:#fff}.fbpost:before{content:"";position:absolute;left:0;right:0;top:0;height:1vw;background:#42b72a}.fb-label{font-size:2vw;font-weight:700;letter-spacing:.08em;color:#fff;margin-bottom:1.4vw}.fb-card{background:rgba(255,255,255,.98);color:#172033;border-radius:22px;padding:1.8vw 2.6vw;box-shadow:0 12px 35px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:.8vw;max-height:80vh;border:2px solid rgba(255,255,255,.55);overflow:hidden}.fb-media-grid{display:grid;gap:.7vw;max-height:35vh;min-height:0}.fb-media-grid.one{grid-template-columns:1fr}.fb-media-grid.two{grid-template-columns:1fr 1fr}.fb-media-grid.three{grid-template-columns:1fr 1fr 1fr}.fb-media-grid.four,.fb-media-grid.many{grid-template-columns:1fr 1fr}.fb-media{min-width:0;min-height:0;overflow:hidden;background:#e9eaed;position:relative}.fb-media img{display:block;width:100%;height:100%;object-fit:cover}.fb-media-grid.one .fb-media img{object-fit:contain}.fb-text{font-size:2.45vw;line-height:1.3;white-space:pre-wrap;overflow-wrap:break-word;max-height:34vh;overflow:hidden;flex:0 1 auto}.fb-date{font-size:1.25vw;color:#68758a}.fb-mark{font-weight:700;color:#1877f2}.fbpost .footer{color:rgba(255,255,255,.82)}.fbpost .footer .fb-mark{color:#fff}
.cardpage.fb-review-theme{background:linear-gradient(135deg,#06172f 0%,#0d4a91 55%,#1877f2 100%);color:#fff}.fb-review-theme:before{content:"";position:absolute;left:0;right:0;top:0;height:1vw;background:#42b72a}.fb-review-theme .location{color:rgba(255,255,255,.78)}.fb-review-theme .source{color:#fff}.fb-review-theme .heading{color:#fff}.fb-review-theme .card{background:rgba(255,255,255,.97);color:#172033;box-shadow:0 12px 35px rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.5)}.fb-review-theme .recommend{color:#1877f2}.fb-review-theme .review-date{color:#68758a}.fb-review-theme .footer{color:rgba(255,255,255,.82)}.fb-review-theme .footer div:last-child{color:#fff;font-weight:700}.recommend{font-size:3.2vw;font-weight:700;margin-bottom:1vw}
.message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font-size:4vw}
</style>
</head>
<body><div id="stage"></div>
<script>
const CONFIG="config.json",GOOGLE_REVIEWS="johnny_vapes_bellevue_4_5_star.json";
let playlist=[],current=-1,timer=null,video=null,generation=0,googleDeck=[],facebookReviewDeck=[],watchdog=null;
const WMO={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫️","Foggy"],48:["🌫️","Foggy"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Showers"],81:["🌧️","Heavy showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
function bust(url){return url+(url.includes("?")?"&":"?")+"v="+Date.now()}
function active(my){return my===generation}
function scheduleNext(my,ms){clearTimeout(timer);timer=setTimeout(()=>{if(active(my))next()},Math.max(250,ms))}
function fitText(el,maxPx,minPx=20){if(!el)return;el.style.fontSize=maxPx+"px";let size=maxPx;const limit=el.clientHeight;while(size>minPx && el.scrollHeight>limit+2){size-=1;el.style.fontSize=size+"px"}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clean(){clearTimeout(timer);timer=null;clearTimeout(watchdog);watchdog=null;if(video){try{video.pause();video.removeAttribute("src");video.load();video.remove()}catch(e){}video=null}document.getElementById("stage").replaceChildren()}
async function init(){const r=await fetch(bust(CONFIG),{cache:"no-store"});const c=await r.json();playlist=(c.playlist||[]).filter(x=>x.enabled!==false);if(!playlist.length)throw Error("Empty playlist");startWatchdog();next()}
function startWatchdog(){setInterval(()=>{const stage=document.getElementById("stage");if(!stage||!stage.children.length){console.warn("Signage watchdog: empty stage; advancing");next()}},30000);setInterval(()=>{if(document.visibilityState!=="visible")return;location.reload()},6*60*60*1000)}
function next(){clean();const my=++generation;current=(current+1)%playlist.length;const x=playlist[current];const t=String(x.type||"").toLowerCase().replace(/-/g,"_");if(t==="image")return image(x,my);if(t==="video")return playVideo(x,my);if(t==="weather")return weather(x.seconds||20,my);if(t==="google_review"||t==="google_reviews")return googleReviews(x.seconds||15,my);if(t==="facebook_post")return facebookPost(x.seconds||15,my);if(t==="facebook_review")return facebookReview(x.seconds||15,my);document.getElementById("stage").innerHTML='<div class="message">Unsupported slide type</div>';scheduleNext(my,5000)}
function image(x,my){const e=document.createElement("img");e.src=bust(x.src);e.onerror=()=>scheduleNext(my,2000);document.getElementById("stage").appendChild(e);scheduleNext(my,Math.max(1,Number(x.seconds)||10)*1000)}
function playVideo(x,my){const v=document.createElement("video");video=v;let advanced=false;const advance=()=>{if(advanced||!active(my))return;advanced=true;next()};v.autoplay=true;v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload="auto";v.controls=false;v.setAttribute("autoplay","");v.setAttribute("muted","");v.setAttribute("playsinline","");v.setAttribute("disablepictureinpicture","");v.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");v.src=bust(x.src);v.addEventListener("ended",advance,{once:true});v.addEventListener("error",()=>{if(active(my))setTimeout(advance,3000)},{once:true});document.getElementById("stage").appendChild(v);const seconds=Number(x.seconds)||0;const startTimer=()=>{v.play().catch(()=>{});if(seconds>0)scheduleNext(my,seconds*1000)};v.addEventListener("loadedmetadata",startTimer,{once:true});v.load();v.play().catch(()=>{})}
function formatDate(s){if(!s)return"";const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}
async function weather(seconds,my){const s=document.getElementById("stage"),b=document.createElement("div");b.className="weather";b.innerHTML='<div style="font-size:3vw">Loading Bellevue weather…</div>';s.appendChild(b);try{const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?name=Bellevue&count=5&language=en&format=json&countryCode=US")).json();const place=(g.results||[]).find(x=>x.admin1==="Wisconsin")||g.results[0];if(!place)throw 0;const u="https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=5";const d=await(await fetch(u)).json(),c=d.current,hd=d.hourly,dy=d.daily,cc=WMO[c.weather_code]||["🌤️","Conditions"];if(!active(my))return;let start=hd.time.findIndex(q=>q>=c.time);if(start<0)start=0;let hours="";for(let n=0;n<12;n++){let k=start+n;if(k>=hd.time.length)break;let tm=new Intl.DateTimeFormat("en-US",{hour:"numeric"}).format(new Date(hd.time[k])),z=WMO[hd.weather_code[k]]||["🌤️",""];hours+=`<div class="hour"><div class="t">${tm}</div><div class="i">${z[0]}</div><div class="deg">${Math.round(hd.temperature_2m[k])}°</div><div class="rain">💧 <b>${Math.round(hd.precipitation_probability[k]??0)}%</b></div></div>`}let days="";for(let n=0;n<5;n++){let z=WMO[dy.weather_code[n]]||["🌤️",""];let name=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(new Date(dy.time[n]+"T12:00:00"));days+=`<div class="day"><div class="dayname">${name}</div><div class="dayicon">${z[0]}</div><span class="high">${Math.round(dy.temperature_2m_max[n])}°</span> / <span class="low">${Math.round(dy.temperature_2m_min[n])}°</span><div class="precip">💧 ${Math.round(dy.precipitation_probability_max[n]??0)}%</div></div>`}const date=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric"}).format(new Date(c.time));b.innerHTML=`<div class="head"><div><div class="title">Bellevue, WI</div><div class="date">${date}</div></div><div class="live">LIVE WEATHER</div></div><div class="current"><div class="icon">${cc[0]}</div><div><div class="temp">${Math.round(c.temperature_2m)}°</div><div class="condition">${cc[1]}</div><div class="details">Feels like ${Math.round(c.apparent_temperature)}° • Humidity ${Math.round(c.relative_humidity_2m)}% • Wind ${Math.round(c.wind_speed_10m)} mph</div></div></div><div class="hourly-title">NEXT 12 HOURS • PRECIPITATION CHANCE</div><div class="hours">${hours}</div><div class="daily-title">5-DAY FORECAST</div><div class="days">${days}</div><div class="updated">Updated ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div>`}catch(e){b.innerHTML='<div style="font-size:4vw">Bellevue Weather<br><small>Weather data temporarily unavailable</small></div>'}if(active(my))scheduleNext(my,Math.max(1,Number(seconds)||20)*1000)}
function reviewText(r){const d=r?.description;if(typeof d==="string")return d.trim();if(d?.en&&typeof d.en==="string")return d.en.trim();return""}
function fitReview(){const el=document.getElementById("gt");if(el){fitText(el,Math.min(54,window.innerWidth*.028),22)}}
function refillGoogleDeck(reviews){googleDeck=shuffle(reviews.slice())}
async function googleReviews(seconds,my){const s=document.getElementById("stage"),b=document.createElement("div");b.className="cardpage google-theme";b.innerHTML='<div class="header"><div><div class="brand">Johnny Vapes</div><div class="location">Bellevue, WI</div></div><div class="source">Google Reviews</div></div><div class="heading">What Our Customers Are Saying</div><div class="card"><div class="stars">★★★★★</div><div class="author" id="ga"></div><div class="review-date" id="gd"></div><div class="review-text" id="gt">Loading review…</div></div><div class="footer"><div>Customer reviews • Johnny Vapes Bellevue</div><div>Google</div></div>';s.appendChild(b);try{const data=await(await fetch(bust(GOOGLE_REVIEWS),{cache:"no-store"})).json();if(!active(my))return;const reviews=(Array.isArray(data)?data:[]).filter(r=>Number(r.rating)>=4.5&&reviewText(r));if(!reviews.length)throw 0;if(!googleDeck.length)refillGoogleDeck(reviews);const totalMs=Math.max(1000,Number(seconds)*1000),slotMs=Math.min(10000,totalMs),start=Date.now();const show=()=>{if(!active(my))return;if(Date.now()-start>=totalMs){next();return}if(!googleDeck.length)refillGoogleDeck(reviews);const r=googleDeck.pop();document.getElementById("ga").textContent=r.author||"Google Customer";document.getElementById("gd").textContent=formatDate(r.review_date||r.created_date);const text=document.getElementById("gt");text.textContent=reviewText(r);requestAnimationFrame(()=>fitReview());timer=setTimeout(show,Math.min(slotMs,Math.max(500,totalMs-(Date.now()-start))))};show()}catch(e){if(!active(my))return;document.getElementById("gt").textContent="Google reviews temporarily unavailable.";scheduleNext(my,seconds*1000)}}
async function facebookPost(seconds,my){const s=document.getElementById("stage"),b=document.createElement("div");b.className="fbpost";b.innerHTML='<div class="fb-label">LATEST FROM FACEBOOK</div><div class="fb-card"><div class="fb-date" id="fb-date"></div><div class="fb-media-grid one" id="fb-media-grid"></div><div class="fb-text" id="fb-text">Loading Facebook post…</div></div><div class="footer"><div>Johnny Vapes</div><div class="fb-mark">Facebook</div></div>';s.appendChild(b);try{const data=await(await fetch(bust("facebook-posts.json"),{cache:"no-store"})).json();if(!active(my))return;const posts=Array.isArray(data)?data:(data.data||[]),p=posts[0];if(!p){document.getElementById("fb-media-grid").style.display="none";document.getElementById("fb-text").textContent="No Facebook posts available."}else{document.getElementById("fb-date").textContent=formatDate(p.created_time);const textEl=document.getElementById("fb-text");textEl.textContent=p.message||p.story||"Facebook post";const urls=[];const addImage=u=>{if(u&&typeof u==="string"&&!urls.includes(u))urls.push(u)};for(const a of (p.attachments?.data||[])){addImage(a?.media?.image?.src);for(const sub of (a?.subattachments?.data||[]))addImage(sub?.media?.image?.src)}const grid=document.getElementById("fb-media-grid");grid.className="fb-media-grid "+(urls.length===1?"one":urls.length===2?"two":urls.length===3?"three":urls.length===4?"four":"many");if(!urls.length)grid.style.display="none";else urls.forEach((url,i)=>{const wrap=document.createElement("div");wrap.className="fb-media";const im=document.createElement("img");im.alt="Facebook post image "+(i+1);im.src=url;im.onload=()=>fitText(textEl,Math.min(47,window.innerWidth*.0245),18);im.onerror=()=>wrap.remove();wrap.appendChild(im);grid.appendChild(wrap)});requestAnimationFrame(()=>{fitText(textEl,Math.min(47,window.innerWidth*.0245),18)});setTimeout(()=>fitText(textEl,Math.min(47,window.innerWidth*.0245),18),1000)}}catch(e){if(!active(my))return;document.getElementById("fb-media-grid").style.display="none";document.getElementById("fb-text").textContent="Unable to load Facebook post."}scheduleNext(my,Math.max(1,Number(seconds)||15)*1000)}
function refillFacebookDeck(reviews){facebookReviewDeck=shuffle(reviews.slice())}
async function facebookReview(seconds,my){const s=document.getElementById("stage"),b=document.createElement("div");b.className="cardpage fb-review-theme";b.innerHTML='<div class="header"><div><div class="brand">Johnny Vapes</div><div class="location">Bellevue, WI</div></div><div class="source">Facebook Reviews</div></div><div class="heading">What Our Customers Are Saying</div><div class="card"><div class="recommend">👍 Recommends Johnny Vapes</div><div class="author" id="fa">Facebook Customer</div><div class="review-date" id="fd"></div><div class="review-text" id="ft">Loading review…</div></div><div class="footer"><div>Customer recommendation • Johnny Vapes Bellevue</div><div>Facebook</div></div>';s.appendChild(b);try{const data=await(await fetch(bust("facebook-reviews.json"),{cache:"no-store"})).json();if(!active(my))return;const reviews=(Array.isArray(data)?data:[]).filter(r=>(r.recommendation_type||"").toLowerCase()==="positive"&&r.review_text);if(!reviews.length)throw 0;if(!facebookReviewDeck.length)refillFacebookDeck(reviews);const totalMs=Math.max(1000,Number(seconds)*1000),slotMs=Math.min(10000,totalMs),start=Date.now();const show=()=>{if(!active(my))return;if(Date.now()-start>=totalMs){next();return}if(!facebookReviewDeck.length)refillFacebookDeck(reviews);const r=facebookReviewDeck.pop();document.getElementById("fa").textContent="Facebook Customer";document.getElementById("fd").textContent=formatDate(r.created_time);const textEl=document.getElementById("ft");textEl.textContent=r.review_text;requestAnimationFrame(()=>fitText(textEl,Math.min(47,window.innerWidth*.0245),18));timer=setTimeout(show,Math.min(slotMs,Math.max(500,totalMs-(Date.now()-start))))};show()}catch(e){if(!active(my))return;document.getElementById("ft").textContent="Facebook reviews temporarily unavailable.";scheduleNext(my,seconds*1000)}}
init().catch(e=>{console.error(e);document.getElementById("stage").innerHTML='<div class="message">Unable to load signage configuration.</div>';setTimeout(()=>location.reload(),15000)});
</script>
</body>
</html>
