<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store 4 Screen 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000}
#stage img,#stage video{position:fixed;inset:0;width:100vw;height:100vh;
object-fit:contain;background:#000;border:0}
.live{position:fixed;inset:0;background:#000;color:#fff;
display:flex;align-items:center;justify-content:center;flex-direction:column;
font-family:Arial,sans-serif;text-align:center}
.live h1{font-size:clamp(42px,6vw,90px);margin:0 0 18px}
.live p{font-size:clamp(22px,3vw,44px);margin:0}
#status{position:fixed;z-index:50;bottom:8px;left:0;right:0;text-align:center;
font:12px Arial;color:#fff;opacity:.18;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">Store 4 • Screen 1</div>

<script>
const CONFIG="config.json";
let playlist=[];
let index=-1;
let timer=null;
let video=null;

async function init(){
  const r=await fetch(CONFIG+"?v="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("Could not load config");
  const cfg=await r.json();

  playlist=(cfg.playlist||[]).filter(item=>item.enabled!==false);
  if(!playlist.length) throw new Error("Playlist is empty");

  showNext();
}

function cleanup(){
  clearTimeout(timer);
  timer=null;

  if(video){
    try{
      video.pause();
      video.removeAttribute("src");
      video.load();
    }catch(e){}
    video.remove();
    video=null;
  }

  document.getElementById("stage").replaceChildren();
}

function showNext(){
  cleanup();
  index=(index+1)%playlist.length;
  const item=playlist[index];
  const stage=document.getElementById("stage");

  if(item.type==="image"){
    const img=document.createElement("img");
    img.src=item.src;
    img.alt="";
    img.draggable=false;
    img.addEventListener("error",()=>setTimeout(showNext,2000),{once:true});
    stage.appendChild(img);
    timer=setTimeout(showNext,(item.seconds||10)*1000);
    return;
  }

  if(item.type==="video"){
    video=document.createElement("video");

    // Native HTML5 video is intentional.
    // TV Bro handles this smoothly without its fullscreen/X overlay.
    video.autoplay=true;
    video.muted=true;
    video.defaultMuted=true;
    video.playsInline=true;
    video.preload="auto";
    video.controls=false;
    video.setAttribute("autoplay","");
    video.setAttribute("muted","");
    video.setAttribute("playsinline","");
    video.setAttribute("disablepictureinpicture","");
    video.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");

    video.src=item.src;

    video.addEventListener("ended",showNext,{once:true});
    video.addEventListener("error",()=>{
      setTimeout(showNext,3000);
    },{once:true});

    stage.appendChild(video);
    video.load();
    video.play().catch(()=>{});
    return;
  }

  if(item.type==="live"){
    const box=document.createElement("div");
    box.className="live";

    const h=document.createElement("h1");
    h.textContent=item.title||"Live Feed";

    const p=document.createElement("p");
    p.textContent="Live feed will be connected here.";

    box.append(h,p);
    stage.appendChild(box);

    timer=setTimeout(showNext,(item.seconds||12)*1000);
    return;
  }
}

init().catch(err=>{
  document.getElementById("stage").innerHTML=
    '<div class="live"><h1>Signage Error</h1><p>Unable to load playlist.</p></div>';
});
</script>
</body>
</html>
