<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Signage Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#player{position:fixed;inset:0;width:100vw;height:100vh}
#msg{position:fixed;left:0;right:0;bottom:20px;text-align:center;color:#fff;
font:18px Arial;z-index:5;text-shadow:0 2px 4px #000}
</style>
</head>
<body>
<div id="player"></div>
<div id="msg">Loading YouTube video…</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
function onYouTubeIframeAPIReady(){
  player=new YT.Player("player",{
    width:"100%",height:"100%",
    videoId:"J93YInokDIM",
    playerVars:{
      autoplay:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,
      modestbranding:1,rel:0,playsinline:1
    },
    events:{
      onReady:e=>{
        document.getElementById("msg").textContent="Ready — attempting autoplay";
        e.target.mute();
        e.target.playVideo();
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING)
          document.getElementById("msg").textContent="Playing automatically";
        if(e.data===YT.PlayerState.ENDED)
          document.getElementById("msg").textContent="VIDEO FINISHED";
      },
      onError:e=>{
        document.getElementById("msg").textContent="YouTube error: "+e.data;
      }
    }
  });
}
</script>
</body>
</html>
