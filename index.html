<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Signage Test</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial,sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; }
  .slide {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity 900ms ease; color:white; text-align:center;
  }
  .slide.active { opacity:1; }
  .card { max-width:80%; }
  h1 { font-size:clamp(42px,7vw,110px); margin:0 0 20px; }
  p { font-size:clamp(22px,3vw,48px); margin:0; }
  .photo { background:linear-gradient(135deg,#14213d,#3a506b); }
  .promo { background:linear-gradient(135deg,#4b134f,#c94b4b); }
  .weather { background:linear-gradient(135deg,#13547a,#80d0c7); }
  .reviews { background:linear-gradient(135deg,#232526,#414345); }
  .small { margin-top:35px; font-size:clamp(16px,1.6vw,28px); opacity:.8; }
</style>
</head>
<body>
<div id="stage">
  <section class="slide photo active"><div class="card"><h1>PRODUCT SLIDE</h1><p>Your product image goes here</p><div class="small">TEST SLIDE 1</div></div></section>
  <section class="slide promo"><div class="card"><h1>PROMOTION</h1><p>Your promotional graphic goes here</p><div class="small">TEST SLIDE 2</div></div></section>
  <section class="slide weather"><div class="card"><h1>WEATHER</h1><p>Store-specific weather will go here</p><div class="small">TEST SLIDE 3</div></div></section>
  <section class="slide reviews"><div class="card"><h1>★ ★ ★ ★ ★</h1><p>Google Reviews will go here</p><div class="small">TEST SLIDE 4</div></div></section>
</div>
<script>
const slides = [...document.querySelectorAll('.slide')];
let i = 0;
const secondsPerSlide = 8;
setInterval(() => {
  slides[i].classList.remove('active');
  i = (i + 1) % slides.length;
  slides[i].classList.add('active');
}, secondsPerSlide * 1000);
</script>
</body>
</html>
