<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes - Store 4 Screen 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000}
#stage>img,#stage>.live,#stage>video{
 position:fixed;inset:0;width:100vw;height:100vh;
}
#stage>img{object-fit:contain;background:#000}
#stage>video{object-fit:contain;background:#000}
.live{display:flex;align-items:center;justify-content:center;flex-direction:column;
font-family:Arial,sans-serif;text-align:center;color:#fff}
.live h1{font-size:6vw;margin:0 0 1vw}.live p{font-size:3vw;margin:0}
#status{position:fixed;z-index:20;bottom:10px;left:0;right:0;text-align:center;
font:14px Arial;color:#fff;opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">Store 4 • Screen 1</div>
<script>
const playlist = [
 {type:"image",src:"media/promo1.jpg",seconds:10},
 {type:"video",src:"https://pub-3250bab389bf4d21b5ff0b1f63045fc7.r2.dev/vid1.mp4"},
 {type:"image",src:"media/promo2.jpg",seconds:10},
 {type:"image",src:"media/promo3.jpg",seconds:10},
 {type:"video",src:"https://pub-3250bab389bf4d21b5ff0b1f63045fc7.r2.dev/vid2.mp4"},
 {type:"image",src:"media/promo4.png",seconds:10},
 {type:"image",src:"media/promo5.png",seconds:10},
 {type:"live",title:"Bellevue Weather",seconds:12},
 {type:"live",title:"Google Reviews",seconds:12},
 {type:"live",title:"Facebook Reviews",seconds:12},
 {type:"live",title:"Facebook / Social",seconds:12}
];

const stage=document.getElementById("stage");
let current=-1, timer=null, video=null, generation=0;

function clearStage(){
  clearTimeout(timer); timer=null;
  if(video){
    try{video.pause(); video.removeAttribute("src"); video.load();}catch(e){}
    try{video.remove();}catch(e){}
    video=null;
  }
  stage.replaceChildren();
}

function next(){show(current+1)}

function show(i){
  const myGeneration=++generation;
  clearStage();
  current=(i+playlist.length)%playlist.length;
  const item=playlist[current];

  if(item.type==="image"){
    const img=document.createElement("img");
    img.src=item.src;
    img.alt="";
    stage.appendChild(img);
    timer=setTimeout(next,(item.seconds||10)*1000);
    return;
  }

  if(item.type==="live"){
    const box=document.createElement("div");
    box.className="live";
    box.innerHTML="<h1>"+item.title+"</h1><p>Live feed will be connected here.</p>";
    stage.appendChild(box);
    timer=setTimeout(next,(item.seconds||12)*1000);
    return;
  }

  if(item.type==="video"){
    // IMPORTANT: reproduce the successful standalone test.
    // There is NO video element on initial page load.
    // Create it only after the video slide becomes active.
    timer=setTimeout(()=>{
      if(myGeneration!==generation)return;

      const v=document.createElement("video");
      video=v;
      v.setAttribute("autoplay","");
      v.setAttribute("muted","");
      v.setAttribute("playsinline","");
      v.setAttribute("preload","auto");
      v.muted=true;
      v.defaultMuted=true;
      v.playsInline=true;
      v.controls=false;
      v.setAttribute("disablepictureinpicture","");
      v.setAttribute("controlslist","nodownload noplaybackrate nofullscreen");
      v.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;";

      v.addEventListener("playing",()=>{
        document.getElementById("status").textContent="Store 4 • Screen 1 • Playing";
      });
      v.addEventListener("ended",()=>{
        if(myGeneration===generation)next();
      },{once:true});
      v.addEventListener("error",()=>{
        if(myGeneration===generation)setTimeout(next,3000);
      },{once:true});

      // Exact sequence used by the successful test.
      stage.appendChild(v);
      v.src=item.src;
      v.load();
      v.play().catch(()=>{});
    },1500);
  }
}

show(0);
</script>
</body>
</html>
