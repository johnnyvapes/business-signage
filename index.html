<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Johnny Vapes Bellevue Signage</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07182c;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;background:#07182c}
.slide{position:absolute;inset:0}
#stage>img,#stage>video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font-size:4vw}

.weather{position:absolute;inset:0;box-sizing:border-box;padding:3vw 3.2vw;color:#fff;background:linear-gradient(135deg,#173b5c,#286f99)}
.head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:clamp(32px,4vw,68px);font-weight:700}.date{font-size:clamp(17px,1.7vw,30px);opacity:.85;margin-top:.3vw}.live{font-size:clamp(15px,1.5vw,25px);letter-spacing:.08em;opacity:.8}
.current{display:flex;align-items:center;height:23vh;gap:1.4vw}.icon{font-size:clamp(55px,7vw,120px)}.temp{font-size:clamp(65px,8vw,130px);font-weight:700;line-height:.9}.condition{font-size:clamp(22px,2.5vw,42px);margin-top:10px}.details{font-size:clamp(17px,1.7vw,29px);opacity:.9}
.hourly-title,.daily-title{font-size:clamp(18px,1.8vw,30px);font-weight:700}.hourly-title{margin-bottom:.7vw}.daily-title{margin:1.2vw 0 .55vw}.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.45vw}.hour{background:rgba(0,0,0,.18);border-radius:10px;text-align:center;padding:.65vw .15vw}.hour .t{font-size:clamp(13px,1.25vw,22px);font-weight:700}.hour .i{font-size:clamp(22px,2.4vw,42px);margin:.35vw 0}.hour .deg{font-size:clamp(16px,1.65vw,28px);font-weight:700}.hour .rain{font-size:clamp(14px,1.45vw,24px);margin-top:.3vw}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.55vw}.day{background:rgba(0,0,0,.18);border-radius:10px;padding:.55vw;text-align:center}.dayname{font-size:clamp(14px,1.45vw,24px);font-weight:700}.dayicon{font-size:clamp(24px,2.5vw,42px)}.high{font-size:clamp(18px,1.7vw,29px);font-weight:700}.low{font-size:clamp(14px,1.4vw,23px);opacity:.7}.precip{font-size:clamp(13px,1.3vw,21px);margin-top:.2vw}.updated{position:absolute;bottom:.7vw;right:1.2vw;font-size:12px;opacity:.45}

.cardpage{position:absolute;inset:0;box-sizing:border-box;padding:4vw 5vw;color:#202124;overflow:hidden}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5vw}.brand{font-size:3.8vw;font-weight:700}.location{font-size:1.6vw;margin-top:.3vw}.source{font-size:1.8vw;font-weight:700}.heading{text-align:center;font-size:2.8vw;font-weight:700;margin:1vw 0 1.8vw}.card{border-radius:22px;padding:3vw 4vw;width:100%;min-height:50vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}.stars{font-size:3.5vw;letter-spacing:.08em;margin-bottom:1.2vw}.author{font-size:2.2vw;font-weight:700}.review-date{font-size:1.25vw;margin-top:.35vw}.review-text{font-size:2.8vw;line-height:1.4;margin-top:2vw;overflow-wrap:break-word}.footer{position:absolute;bottom:1.2vw;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:1.1vw}
.google-theme{background:linear-gradient(135deg,#f8fbff,#fff 52%,#eef4ff)}.google-theme:before{content:"";position:absolute;left:0;right:0;top:0;height:1.1vw;background:linear-gradient(90deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75% 100%)}.google-theme .location{color:#5f6368}.google-theme .source{color:#4285f4}.google-theme .card{background:rgba(255,255,255,.96);border:2px solid #dfe5ef;box-shadow:0 10px 30px rgba(66,133,244,.14)}.google-theme .stars{color:#fbbc04}.google-theme .review-date,.google-theme .footer{color:#6b7078}
.fbpost{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#071b38,#0b3d78 52%,#1877f2);color:#fff;padding:4vw 5vw}.fb-card{background:rgba(255,255,255,.98);color:#172033;border-radius:22px;padding:2.2vw 3vw;display:flex;flex-direction:column;gap:1vw;max-height:78vh}.fb-text{font-size:2.7vw;line-height:1.35;white-space:pre-wrap;overflow:hidden}.fb-date{font-size:1.25vw;color:#68758a}.fb-mark{font-weight:700;color:#1877f2}
.fb-review-theme{background:linear-gradient(135deg,#06172f,#0d4a91 55%,#1877f2);color:#fff}.fb-review-theme:before{content:"";position:absolute;left:0;right:0;top:0;height:1vw;background:#42b72a}.fb-review-theme .card{background:rgba(255,255,255,.97);color:#172033}.recommend{font-size:3.2vw;font-weight:700;margin-bottom:1vw;color:#1877f2}

.traffic-slide{position:absolute;inset:0;background:#eaf0f5}
.traffic-header{position:absolute;z-index:20;left:0;right:0;top:0;height:8.2vh;background:#102d4d;color:#fff;display:flex;align-items:center;padding:0 2vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.traffic-logo-mark{width:5.2vh;height:5.2vh;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-right:1vw;overflow:hidden;flex:0 0 auto}
.traffic-logo-mark span{font-size:2.8vh}
.traffic-title{font-size:clamp(28px,3.25vw,62px);font-weight:800;letter-spacing:.02em}
.traffic-meta{margin-left:auto;text-align:right;font-size:clamp(14px,1.15vw,23px);line-height:1.2}.traffic-meta b{font-size:clamp(16px,1.35vw,27px)}

.traffic-panel{position:absolute;z-index:15;left:0;top:8.2vh;bottom:0;width:25%;background:#f7f9fb;border-right:2px solid #d8e0e7;overflow:hidden;padding:1.2vw .8vw .7vw}
.panel-section{margin-bottom:1vw}.panel-heading{font-size:clamp(20px,1.55vw,31px);font-weight:800;color:#173552;margin:.15vw .25vw .55vw}
.event-list,.delay-list{display:flex;flex-direction:column;gap:.42vw}.traffic-item,.delay-item{background:#eef2f6;border-radius:10px;border-left:4px solid #16a765;padding:.45vw .55vw;min-height:4.9vh;overflow:hidden}.traffic-item .road{font-size:clamp(14px,1.15vw,23px);font-weight:800;color:#173552;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.traffic-item .desc{font-size:clamp(10px,.78vw,16px);color:#68788a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15vw}.delay-item .road{font-size:clamp(14px,1.05vw,22px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delay-item .route{font-size:clamp(10px,.72vw,15px);color:#66798c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.12vw 0}.delay-item .delay{font-size:clamp(13px,1.05vw,22px);font-weight:800}.empty{padding:.8vw;background:#eef2f6;border-radius:10px;color:#526577;font-size:clamp(12px,.9vw,18px)}
.traffic-footer{position:absolute;left:.7vw;right:.7vw;bottom:.35vw;font-size:clamp(8px,.55vw,12px);color:#778899;display:flex;justify-content:space-between}
.map-wrap{position:absolute;left:25%;right:0;top:8.2vh;bottom:0;background:#ddd}
#trafficMap{position:absolute;inset:0}
.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.72)!important}
.store-marker{width:5.4vw;height:5.4vw;min-width:52px;min-height:52px;max-width:86px;max-height:86px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;overflow:hidden}
.store-marker img{width:100%;height:100%;object-fit:cover}
.traffic-legend{position:absolute;z-index:500;left:1.2vw;bottom:1.1vw;background:rgba(255,255,255,.95);border-radius:8px;padding:.5vw .8vw;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:clamp(10px,.8vw,16px);font-weight:700;color:#20344a}
.legend-row{display:flex;align-items:center;gap:.7vw}.legend-chip{display:flex;align-items:center;gap:.25vw}.legend-line{width:1.2vw;height:.25vw;border-radius:2px}
.map-label{position:absolute;z-index:501;left:1vw;top:1vw;background:#102d4d;color:#fff;padding:.55vw .9vw;border-radius:7px;font-size:clamp(15px,1.2vw,25px);font-weight:800;box-shadow:0 2px 7px rgba(0,0,0,.2)}
.map-label small{display:block;font-size:.55em;font-weight:500;opacity:.82;margin-top:.15vw}
.wider-inset{position:absolute;z-index:700;right:1.1vw;top:1vw;width:24vw;height:18vw;max-width:420px;max-height:310px;background:#fff;border:2px solid #fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.28);overflow:hidden}
#widerMap{position:absolute;inset:0}
.wider-title{position:absolute;z-index:701;left:.8vw;top:.7vw;background:#102d4d;color:#fff;padding:.45vw .7vw;border-radius:6px;font-size:clamp(12px,.9vw,18px);font-weight:800}
.wider-pin{position:absolute;z-index:702;width:2.5vw;height:2.5vw;min-width:30px;min-height:30px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);overflow:hidden}.wider-pin img{width:100%;height:100%;object-fit:cover}

@media (max-width:1100px){
 .traffic-panel{width:28%}.map-wrap{left:28%}.traffic-title{font-size:3vw}.traffic-panel .traffic-item{min-height:5vh}
}
</style>
</head>

function bust(url){return url+(url.includes("?")?"&":"?")+"v="+Date.now()}
function clean(){
 clearTimeout(timer);timer=null;
 if(video){try{video.pause();video.removeAttribute("src");video.load();video.remove()}catch(e){}video=null}
 if(trafficMap){try{trafficMap.remove()}catch(e){}trafficMap=null}

function next(){
 clean();current=(current+1)%playlist.length;const x=playlist[current];
 if(x.type==="image")return image(x);
 if(x.type==="video")return playVideo(x);

 if(x.type==="google_reviews")return googleReviews(x.seconds||15);

}

  const place=(g.results||[]).find(x=>x.admin1==="Wisconsin")||g.results[0];if(!place)throw 0;

  let days="";for(let n=0;n<5;n++){let z=WMO[dy.weather_code[n]]||["🌤️",""];let name=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(new Date(dy.time[n]+"T12:00:00"));days+=`<div class="day"><div class="dayname">${name}</div><div class="dayicon">${z[0]}</div><span class="high">${Math.round(dy.temperature_2m_max[n])}°</span> / <span class="low">${Math.round(dy.temperature_2m_min[n])}°</span><div class="precip">💧 ${Math.round(dy.precipitation_probability_max[n]??0)}%</div></div>`}

 }catch(e){b.innerHTML='<div style="font-size:4vw">Bellevue Weather<br><small>Weather data temporarily unavailable</small></div>'}
 timer=setTimeout(next,seconds*1000)
}

 <aside class="traffic-panel">
   <section class="panel-section"><div class="panel-heading">Current Conditions</div><div id="trafficEvents" class="event-list"></div></section>
   <section class="panel-section" style="margin-top:.7vw"><div class="panel-heading">Traffic Delays</div><div id="trafficDelays" class="delay-list"></div></section>
   <div class="traffic-footer"><span>Live 511WI data</span><span>Auto-refresh</span></div>
 </aside>
 <main class="map-wrap">
   <div id="trafficMap"></div>
   <div class="map-label">Bellevue / Green Bay<small>511WI traffic speeds</small></div>
   <div class="traffic-legend">
     <div class="legend-row">
       <span class="legend-chip"><i class="legend-line" style="background:#0a9f63"></i>Fast</span>
       <span class="legend-chip"><i class="legend-line" style="background:#f2c400"></i>Moderate</span>
       <span class="legend-chip"><i class="legend-line" style="background:#f57c00"></i>Slow</span>
       <span class="legend-chip"><i class="legend-line" style="background:#e31b2f"></i>Very slow / stopped</span>
     </div>
   </div>
   <div class="wider-inset"><div id="widerMap"></div><div class="wider-title">WIDER AREA</div></div>
 </main>`;
 try{
   const data=await(await fetch(bust("traffic.json"),{cache:"no-store"})).json();
   const events=Array.isArray(data.events)?data.events:[];
   const times=Array.isArray(data.travel_times)?data.travel_times:[];
   const evBox=document.getElementById("trafficEvents"),delBox=document.getElementById("trafficDelays");
   evBox.innerHTML="";
   events.slice(0,7).forEach(e=>{
     const item=document.createElement("div");item.className="traffic-item";item.style.borderLeftColor=eventColor(e);
     item.innerHTML='<div class="road"><span style="color:'+eventColor(e)+'">●</span> '+safe(e.roadway||"Traffic event")+'</div><div class="desc">'+safe(e.description||e.comment||"Active 511WI event")+'</div>';
     evBox.appendChild(item);
   });
   if(!events.length)evBox.innerHTML='<div class="empty">No active traffic events in the Bellevue / Green Bay area.</div>';
   delBox.innerHTML="";
   times.slice(0,6).forEach(t=>{
     const mins=Number(t.delay_minutes||0),c=trafficColor(mins),item=document.createElement("div");item.className="delay-item";item.style.borderLeftColor=c[0];
     const road=t.roadway||t.description||"Traffic segment";const route=t.description||"Local traffic delay";const current=t.current_time_minutes!=null?Math.round(Number(t.current_time_minutes))+" min travel time":"";
     item.innerHTML='<div class="road"><span style="color:'+c[0]+'">●</span> '+safe(road)+'</div><div class="route">'+safe(String(route))+'</div><div class="delay" style="color:'+c[0]+'">+'+Math.round(mins)+' min delay'+(current?" • "+current:"")+'</div>';
     delBox.appendChild(item);
   });
   if(!times.length)delBox.innerHTML='<div class="empty">No significant traffic delays reported.</div>';
   document.getElementById("trafficUpdated").textContent="Updated "+new Date(data.generated_at||Date.now()).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
   initTrafficMaps(data);
 }catch(e){
   document.getElementById("trafficEvents").innerHTML='<div class="traffic-item" style="border-left-color:#f47b20">Unable to load current 511WI events.</div>';
   document.getElementById("trafficDelays").innerHTML='<div class="delay-item" style="border-left-color:#f47b20">Unable to load current travel times.</div>';
   initTrafficMaps({});
 }
 timer=setTimeout(next,seconds*1000);
}

function initTrafficMaps(data){
 const center=[44.505,-88.04];
 trafficMap=L.map("trafficMap",{center,zoom:14,zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(trafficMap);

 // The workflow publishes z=14 tiles in traffic_tiles/14/x/y.png.
 // Missing tiles simply remain transparent; no live 511 request is made by the signage page.
 const manifestTiles=new Set(((data.traffic_tiles&&data.traffic_tiles.tiles)||[]).map(t=>String(t.path||"")));
 const TrafficGrid=L.GridLayer.extend({
   createTile:function(coords,done){
     const tile=document.createElement("img");tile.alt="";tile.width=256;tile.height=256;tile.setAttribute("aria-hidden","true");
     const key=coords.z+"/"+coords.x+"/"+coords.y+".png";
     if(manifestTiles.size && !manifestTiles.has(key)){tile.src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";setTimeout(()=>done(null,tile),0);return tile}
     tile.onload=()=>done(null,tile);tile.onerror=()=>done(null,tile);
     tile.src="traffic_tiles/"+coords.z+"/"+coords.x+"/"+coords.y+".png";
     return tile;
   }
 });
 new TrafficGrid({tileSize:256,opacity:.88,zIndex:300,noWrap:true}).addTo(trafficMap);

 const markerIcon=L.divIcon({className:"",html:'<div class="store-marker"><img src="'+LOGO_DATA+'" alt=""></div>',iconSize:[74,74],iconAnchor:[37,37]});
 L.marker([44.469354,-87.982207],{icon:markerIcon,interactive:false}).addTo(trafficMap);
 L.marker([44.541733,-88.093166],{icon:markerIcon,interactive:false}).addTo(trafficMap);
 trafficMap.invalidateSize();

 widerMap=L.map("widerMap",{center:[44.505,-88.04],zoom:11,zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(widerMap);
 const widerIcon=L.divIcon({className:"",html:'<div class="wider-pin"><img src="'+LOGO_DATA+'" alt=""></div>',iconSize:[42,42],iconAnchor:[21,21]});
 L.marker([44.469354,-87.982207],{icon:widerIcon,interactive:false}).addTo(widerMap);
 L.marker([44.541733,-88.093166],{icon:widerIcon,interactive:false}).addTo(widerMap);
 widerMap.invalidateSize();
}
async function init(){
 const r=await fetch(bust(CONFIG),{cache:"no-store"});const c=await r.json();
 playlist=(c.playlist||[]).filter(x=>x.enabled!==false);
 if(!playlist.length)throw Error("Empty playlist");
 setInterval(()=>location.reload(),Math.max(10,c.refresh_minutes||30)*60000);
 next();
}
init().catch(e=>document.getElementById("stage").innerHTML='<div class="message">Unable to load signage configuration.</div>');
</script>
</body>
</html>
