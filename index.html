<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2 MSE Test</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}#status{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#fff;font:16px Arial;opacity:.7}</style></head>
<body><video id="v" autoplay muted playsinline></video><div id="status">Starting MSE test…</div>
<script>
const URL_R2="https://pub-3250bab389bf4d21b5ff0b1f63045fc7.r2.dev/vid1.mp4";
const MIME='video/mp4; codecs="avc1.4d001e,mp4a.40.2"';
const v=document.getElementById("v"), s=document.getElementById("status");
const msg=t=>s.textContent=t;
async function start(){
 if(!window.MediaSource){msg("MediaSource is not supported");return;}
 if(!MediaSource.isTypeSupported(MIME)){msg("MSE codec not supported");return;}
 try{
  msg("Fetching MP4…");
  const r=await fetch(URL_R2,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.arrayBuffer();
  const ms=new MediaSource();
  v.src=URL.createObjectURL(ms);
  ms.addEventListener("sourceopen",()=>{
   try{
    const sb=ms.addSourceBuffer(MIME);
    sb.addEventListener("updateend",()=>{try{ms.endOfStream()}catch(e){};v.play().catch(()=>{})},{once:true});
    sb.addEventListener("error",()=>msg("SourceBuffer error"));
    msg("Appending MP4…"); sb.appendBuffer(data);
   }catch(e){msg("MSE error: "+e.name)}
  },{once:true});
  v.addEventListener("playing",()=>msg("Playing automatically via MSE"));
  v.addEventListener("ended",()=>msg("VIDEO FINISHED"));
  v.addEventListener("error",()=>msg("Video error"));
 }catch(e){msg("Fetch/MSE failed: "+e.message)}
}
start();
</script></body></html>
